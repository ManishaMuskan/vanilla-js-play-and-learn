<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Throttling</title>
    <style>
      .textBox {
        width: 50%;
        padding: 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h4>Throttling</h4>
    <input
      type="text"
      id="searchBox"
      placeholder="try throttling with searchBox"
      class="textBox"
      onkeyup="callFetchApiOnThrottle(event.target.value, 'fghg', 'dgf')"
    />
    <script src="./index.js"></script>
  </body>
</html>
